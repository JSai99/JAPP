<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#f4f5f7">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>同儕互評</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f4f5f7; --card: #fff; --line: #dfe2e6; --text: #1f2328; --dim: #67707a;
  --accent: #3b6fe0; --accent-soft: #e8efff; --seg: #eceff3; --ok: #1f8a4c; --ok-soft: #e3f5ea; --warn: #b4540a; --err: #c62828;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tone=light]) { --bg: #1d2023; --card: #2a2e32; --line: #3d4247; --text: #e8eaed; --dim: #9aa0a6;
          --accent: #6b9bff; --accent-soft: #23314f; --seg: #363b41; --ok: #4cc27f; --ok-soft: #1e3a2a; --warn: #f0a050; --err: #ff6b6b; }
}
/* 活動主題：深色主題強制深色配色、淺色主題強制淺色配色 */
:root[data-tone=dark] { --bg: #1d2023; --card: #2a2e32; --line: #3d4247; --text: #e8eaed; --dim: #a9afb6;
          --accent: #6b9bff; --accent-soft: #23314f; --seg: #363b41; --ok: #4cc27f; --ok-soft: #1e3a2a; --warn: #f0a050; --err: #ff6b6b; }
:root[data-tone=light] { --bg: #f4f5f7; --card: #fff; --line: #dfe2e6; --text: #1f2328; --dim: #67707a;
  --accent: #3b6fe0; --accent-soft: #e8efff; --seg: #eceff3; --ok: #1f8a4c; --ok-soft: #e3f5ea; --warn: #b4540a; --err: #c62828; }
:root[data-theme=candle] { --accent: #d98a3a; --accent-soft: #3a2a1c; --card: #2a211b; --line: #45372b; --seg: #3a2f27; }
:root[data-theme=starry] { --accent: #8f7dff; --accent-soft: #2c2a5e; --card: #1f2150; --line: #36397a; --seg: #2c2f6a; }
:root[data-theme=ember]  { --accent: #e8743f; --accent-soft: #3a1e1a; --card: #2a1a1c; --line: #45292b; --seg: #3a2527; }
:root[data-theme=pastel] { --accent: #c2547f; --accent-soft: #f9e4ee; }
:root[data-theme=bubble] { --accent: #4a7be6; }
:root[data-theme=dawn]   { --accent: #b8532f; --accent-soft: #fde8de; }
:root[data-theme=mint]   { --accent: #1d8060; --accent-soft: #dcf3e9; }
:root[data-theme=paper]  { --accent: #9a6b3a; --accent-soft: #f3e9d8; }
/* 用 lvh（網址列收起時的高度）固定大小，滑動時網址列伸縮不會讓背景重畫閃白 */
/* Android Chrome：關掉下拉重新整理（iOS Safari 不支援，改靠重新整理後自動回到原本的評分頁） */
html, body { overscroll-behavior-y: none; }
#bg { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100lvh; z-index: -1; pointer-events: none; }
:root[data-tone] body { background: transparent; }
:root[data-tone] .card, :root[data-tone] .item, :root[data-tone] .pickcard {
  background: color-mix(in srgb, var(--card) 92%, transparent); }
body {
  font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.55;
  padding: 16px 16px calc(32px + env(safe-area-inset-bottom));
}
main { max-width: 560px; margin: 0 auto; }
@media (min-width: 768px) { body { padding-top: 40px; font-size: 17px; } main { max-width: 620px; } }
h1 { font-size: 20px; margin: 4px 0 2px; }
h2 { font-size: 17px; margin-bottom: 10px; }
.sub { color: var(--dim); font-size: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px; margin-top: 14px; }
label.f { display: block; font-weight: 600; margin-bottom: 6px; }
input[type=text], textarea {
  width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 12px;
}
input.code { text-transform: uppercase; letter-spacing: 4px; font-size: 22px; text-align: center; font-weight: 700; }
textarea { min-height: 90px; resize: vertical; }
button {
  font: inherit; font-size: 16px; border: 0; border-radius: 10px; padding: 12px 16px; cursor: pointer;
  background: var(--accent); color: #fff; font-weight: 600;
}
button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
button:disabled { opacity: .45; cursor: default; }
.full { width: 100%; margin-top: 12px; }
.err { color: var(--err); font-size: 14px; margin-top: 10px; min-height: 1em; white-space: pre-line; }
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 8px; }
.names button { background: var(--accent-soft); color: var(--text); font-weight: 600; padding: 16px 8px; }
.names button.taken { background: var(--bg); color: var(--dim); font-weight: 400; }
.tabs { display: flex; gap: 8px; margin-top: 14px; }
.tabs button { flex: 1; background: var(--card); color: var(--text); border: 1px solid var(--line); }
.tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.list { display: grid; gap: 10px; margin-top: 12px; }
.item { display: flex; align-items: center; justify-content: space-between; gap: 10px;
        background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; width: 100%;
        color: var(--text); font-weight: 600; text-align: left; }
.item .tag { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.item.done { cursor: default; }
.item.done .tag { background: var(--ok-soft); color: var(--ok); }
.crit { padding: 14px 0; border-bottom: 1px solid var(--line); }
.crit:last-of-type { border-bottom: 0; }
.crit .q { font-weight: 700; }
.crit .d { color: var(--dim); font-size: 13px; margin-top: 2px; }
.scale { display: flex; gap: 4px; margin-top: 12px; }
.scale button { flex: 1; height: 46px; padding: 0; border-radius: 4px; background: var(--seg); color: var(--dim);
                font-weight: 700; font-size: 15px; transition: background .15s, color .15s; }
.scale button:first-child { border-radius: 12px 4px 4px 12px; }
.scale button:last-child { border-radius: 4px 12px 12px 4px; }
.scale button.fill { background: var(--accent); color: #fff; }
.scale button.fill.cur { filter: brightness(.88); }
.scale-read { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--dim); margin-top: 6px; min-height: 1.4em; }
.scale-read b { color: var(--accent); font-size: 15px; }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 10px; }
.picks button { background: var(--seg); color: var(--text); font-weight: 600; padding: 14px 8px; }
.pickcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-top: 12px; }
.pickcard.done { opacity: .7; }
.ptag { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.ptag.ok { background: var(--ok-soft); color: var(--ok); }
.anon { font-size: 13px; color: var(--ok); margin-top: 8px; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.linkbtn { background: none; color: var(--accent); padding: 4px 0; font-size: 14px; font-weight: 600; }
.progress { font-size: 14px; color: var(--dim); margin-top: 6px; }
.banner { background: var(--accent-soft); border-radius: 12px; padding: 14px 16px; margin-top: 14px; font-size: 15px; }
.banner.warn { background: #fff4e5; color: #7a3d00; }
@media (prefers-color-scheme: dark) { :root:not([data-tone=light]) .banner.warn { background: #3a2a14; color: #ffd29a; } }
:root[data-tone=dark] .banner.warn { background: #3a2a14; color: #ffd29a; }
.gchip { display: inline-block; color: #fff; font-weight: 800; padding: 7px 14px; border-radius: 10px; font-size: 17px; letter-spacing: .5px; line-height: 1.35; text-shadow: 0 1px 1px rgba(0,0,0,.12); }
.gchip.sm { font-size: 14px; padding: 3px 10px; border-radius: 8px; margin-right: 6px; }
.item .gchip { font-size: 16px; }
.item .lead { display: flex; align-items: center; gap: 10px; }
.ord { font-size: 12px; font-weight: 700; color: var(--dim); white-space: nowrap; }
.item.done .gchip { opacity: .55; }
.item.wait { cursor: default; opacity: .7; }
.item.wait .tag { background: var(--line); color: var(--dim); }
.item.wait .gchip { opacity: .6; }
.hidden { display: none !important; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
         background: var(--ok); color: #fff; padding: 10px 18px; border-radius: 99px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,.2); }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
  <!-- 1. 輸入組別代碼 -->
  <section id="step-load" class="hidden"><p class="sub" style="text-align:center;margin-top:30vh">載入中…</p></section>
  <section id="step-code">
    <h1>同儕互評</h1>
    <p class="sub">請輸入老師發給你們組的代碼</p>
    <div class="card">
      <label class="f" for="code">組別代碼</label>
      <input id="code" class="code" type="text" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="例：K7M2QX">
      <button id="btn-code" class="full">下一步</button>
      <p class="err" id="err-code"></p>
    </div>
  </section>

  <!-- 2. 選自己的名字 -->
  <section id="step-name" class="hidden">
    <div class="top">
      <div><h1 id="title-name"></h1><p class="sub" id="group-name"></p></div>
    </div>
    <div class="card">
      <h2>你是哪一位？</h2>
      <p class="sub">點自己的名字。選定後這支手機就代表你，其他人無法再選這個名字。</p>
      <div class="names" id="names"></div>
      <p class="err" id="err-name"></p>
    </div>
  </section>

  <!-- 3. 評分總覽 -->
  <section id="step-home" class="hidden">
    <div class="top">
      <div><h1 id="title-home"></h1><p class="sub" id="who"></p></div>
      <button class="linkbtn" id="btn-refresh">重新整理</button>
    </div>
    <div id="closed" class="banner warn hidden">老師還沒開放評分（或評分已結束）。開放後按右上角「重新整理」。</div>
    <div class="tabs" id="tabs">
      <button data-tab="inter" class="on">評其他組</button>
      <button data-tab="intra">評組員</button>
    </div>
    <p class="anon hidden" id="anon-note">🔒 組內互評完全匿名，連老師也看不到是誰給的分數。</p>
    <p class="progress" id="progress"></p>
    <div id="picks"></div>
    <div class="list" id="list"></div>
  </section>

  <!-- 4. 評分表單 -->
  <section id="step-form" class="hidden">
    <div class="top">
      <div><p class="sub" id="form-kind"></p><h1 id="form-target"></h1></div>
      <button class="linkbtn" id="back-home">返回</button>
    </div>
    <div class="card">
      <div id="form-crit"></div>
    </div>
    <button id="btn-submit" class="full">送出</button>
    <p class="sub" style="text-align:center;margin-top:8px">送出後無法修改，請確認後再送出</p>
    <p class="err" id="err-form"></p>
  </section>
</main>
<div class="toast hidden" id="toast"></div>

<script src="../shared/vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="colors.js"></script>
<script src="themes.js"></script>
<script>
(() => {
  const db = supabase.createClient(PEER_CONFIG.supabaseUrl, PEER_CONFIG.supabaseKey, { auth: { persistSession: false } });
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // localStorage 可能被封鎖（無痕模式等），一律包起來
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem('peer:' + k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem('peer:' + k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem('peer:' + k); } catch {} },
  };
  function deviceToken() {
    let t = store.get('device');
    if (!t) {
      const a = new Uint8Array(16); crypto.getRandomValues(a);
      t = Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');
      store.set('device', t);
    }
    return t;
  }
  const S = { code: '', info: null, me: null, done: { inter: new Set(), intra: new Set(), pick: new Set() }, tab: 'inter', target: null, answers: {} };

  function show(step) {
    const same = !$('step-' + step).classList.contains('hidden');
    for (const s of ['load', 'code', 'name', 'home', 'form']) $('step-' + s).classList.toggle('hidden', s !== step);
    if (step !== 'form' && step !== 'load') { try { sessionStorage.removeItem('peer-open'); } catch {} }
    if (!same) window.scrollTo(0, 0);
  }
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 2200);
  }
  function errMsg(e) {
    const m = e?.message || String(e);
    if (/Failed to fetch|NetworkError|network/i.test(m)) return '連線失敗，請確認網路後再試一次';
    return m;
  }
  async function rpc(name, args) {
    const { data, error } = await db.rpc(name, args);
    if (error) throw error;
    return data;
  }

  // ── 1. 代碼 ──
  async function enterCode(code) {
    $('err-code').textContent = '';
    code = code.trim().toUpperCase();
    if (!code) { $('err-code').textContent = '請輸入代碼'; return; }
    $('btn-code').disabled = true;
    try {
      S.info = await rpc('student_enter', { p_code: code });
      applyTheme(S.info.activity.theme);
      S.code = code;
      store.set('code', code);
      const saved = store.get('me:' + code);
      if (saved && S.info.members.some((m) => m.id === saved)) { await claim(saved, true); }
      else renderNames();
    } catch (e) {
      $('err-code').textContent = errMsg(e);
      if (code === store.get('mine') && /找不到/.test(e.message)) store.del('mine'); // 活動已刪除，才允許輸入新代碼
      show('code');
    }
    finally { $('btn-code').disabled = false; }
  }
  $('btn-code').onclick = () => enterCode($('code').value);
  $('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') enterCode($('code').value); });
  // 活動主題背景
  let stopTheme = null, curTheme = 'plain';
  function applyTheme(name) {
    const th = PEER_THEMES[name] ? name : 'plain';
    if (th === curTheme) return;
    curTheme = th; stopTheme?.(); stopTheme = null; store.set('theme', th);
    const root = document.documentElement, t = PEER_THEMES[th];
    if (th === 'plain') { delete root.dataset.theme; delete root.dataset.tone; root.style.backgroundColor = ''; return; }
    root.style.backgroundColor = t.bg[1]; // 背景萬一來不及畫，露出的是主題底色而不是白色
    root.dataset.theme = th; root.dataset.tone = t.dark ? 'dark' : 'light';
    document.querySelector('meta[name=theme-color]')?.setAttribute('content', t.bg[0]);
    stopTheme = playTheme(th, $('bg'));
  }

  // ── 2. 選名字 ──
  function renderNames() {
    $('title-name').textContent = S.info.activity.title;
    $('group-name').innerHTML = groupChip(S.info.group.name, S.info.group.position, 'sm');
    $('err-name').textContent = '';
    $('names').innerHTML = S.info.members.map((m) =>
      `<button data-id="${m.id}" class="${m.claimed ? 'taken' : ''}">${esc(m.name)}${m.claimed ? '<br><small>已有人選</small>' : ''}</button>`).join('');
    $('names').querySelectorAll('button').forEach((b) => b.onclick = () => {
      const m = S.info.members.find((x) => x.id === b.dataset.id);
      if (!confirm(`確定你是「${m.name}」嗎？\n選定後這支手機就代表你。`)) return;
      claim(m.id, false);
    });
    show('name');
  }
  async function claim(memberId, silent) {
    try {
      const r = await rpc('student_claim', { p_code: S.code, p_member: memberId, p_token: deviceToken() });
      S.me = S.info.members.find((m) => m.id === memberId);
      S.done.inter = new Set(r.inter_done); S.done.intra = new Set(r.intra_done); S.done.pick = new Set(r.pick_done || []);
      S.arrived = r.arrived_at ? Date.parse(r.arrived_at) : null; S.makeup = !!r.makeup;
      store.set('me:' + S.code, memberId);
      store.set('mine', S.code); // 選定名字後，這支手機就固定用這個代碼，不能換
      // 手機下拉不小心重新整理時，回到原本正在填的評分頁（草稿本來就有存）
      let open = null; try { open = JSON.parse(sessionStorage.getItem('peer-open')); } catch {}
      renderHome();
      if (open && !S.done[open.kind]?.has(open.id) && targets(open.kind).some((t) => t.id === open.id)) openForm(open.kind, open.id);
    } catch (e) {
      if (silent) { store.del('me:' + S.code); renderNames(); }
      $('err-name').textContent = errMsg(e);
      if (!silent) show('name');
    }
  }

  // ── 3. 總覽 ──
  const qt = (c) => c.qtype || (c.is_text ? 'text' : 'score');
  const crits = (kind) => S.info.criteria.filter((c) => c.kind === kind && qt(c) !== 'pick');
  const pickQs = (kind) => S.info.criteria.filter((c) => c.kind === kind && qt(c) === 'pick');
  const WORDS5 = ['待加強', '尚可', '普通', '良好', '優秀'];
  const word = (v) => (S.info.activity.scale_max === 5 ? WORDS5[v - 1] : '');
  function targets(kind) {
    return kind === 'inter' ? S.info.other_groups : S.info.members.filter((m) => m.id !== S.me.id);
  }
  function renderHome() {
    const a = S.info.activity;
    $('title-home').textContent = a.title;
    $('who').innerHTML = `${groupChip(S.info.group.name, S.info.group.position, 'sm')} ${esc(S.me.name)}`;
    $('closed').classList.toggle('hidden', a.is_open);
    const intraOn = a.intra_enabled && S.info.criteria.some((c) => c.kind === 'intra') && targets('intra').length > 0;
    $('tabs').classList.toggle('hidden', !intraOn);
    if (!intraOn) S.tab = 'inter';
    $('tabs').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.tab === S.tab));
    const hasRate = crits(S.tab).length > 0;
    // 逐組開放：還沒報告的組先鎖住；進來前就開始報告的組（晚到）不用評
    const paced = S.tab === 'inter' && a.inter_paced && !S.makeup;
    const state = (t) => S.done[S.tab].has(t.id) ? 'done'
      : !paced ? 'open'
      : !t.opened_at ? 'notyet'
      : S.arrived && S.arrived > Date.parse(t.opened_at) ? 'missed' : 'open';
    const list = hasRate ? targets(S.tab).filter((t) => state(t) !== 'missed') : [], done = S.done[S.tab];
    const pq = pickQs(S.tab);
    const total = list.length + pq.length;
    const n = list.filter((t) => done.has(t.id)).length + pq.filter((c) => S.done.pick.has(c.id)).length;
    $('anon-note').classList.toggle('hidden', S.tab !== 'intra');
    $('progress').textContent = n === total && total
      ? `全部完成（${n}/${total}），謝謝你！`
      : `已完成 ${n}/${total}${S.tab !== 'inter' ? '' : paced ? '　每組開始報告時，老師會開放評分' : '　每組報告結束後再評'}`;
    const missed = hasRate && paced ? targets('inter').filter((t) => state(t) === 'missed').length : 0;
    if (missed) $('progress').textContent += `（${missed} 組在你進來前就報告了，不用評）`;
    renderPicks(pq);
    $('list').innerHTML = list.map((t) => {
      const st = state(t), d = st === 'done', wait = st === 'notyet';
      const draft = !d && store.get(`draft:${S.code}:${S.me.id}:${t.id}`);
      return `<button class="item ${d ? 'done' : ''} ${wait ? 'wait' : ''}" data-id="${t.id}" ${d || wait ? 'disabled' : ''}>
        ${S.tab === 'inter' ? `<span class="lead">${groupChip(t.name, t.position)}${t.report_order ? `<span class="ord">第 ${t.report_order} 個報告</span>` : ''}</span>` : `<span>${esc(t.name)}</span>`}<span class="tag">${d ? '已送出 ✓' : wait ? '還沒報告' : draft ? '草稿' : '去評分'}</span></button>`;
    }).join('');
    $('list').querySelectorAll('.item:not(.done):not(.wait)').forEach((b) => b.onclick = () => openForm(S.tab, b.dataset.id));
    show('home');
  }
  $('tabs').querySelectorAll('button').forEach((b) => b.onclick = () => { S.tab = b.dataset.tab; renderHome(); });
  $('btn-refresh').onclick = async () => {
    try {
      S.info = await rpc('student_enter', { p_code: S.code });
      await claim(S.me.id, false);
      toast('已更新');
    } catch (e) { alertErr(e); }
  };
  function alertErr(e) { $('progress').textContent = errMsg(e); }
  // 停在總覽頁時每 10 秒默默更新：老師調整報告順序或開放評分，學生不用自己按重新整理
  setInterval(async () => {
    if (document.hidden || !S.me || $('step-home').classList.contains('hidden')) return;
    try {
      const info = await rpc('student_enter', { p_code: S.code });
      if (JSON.stringify(info) === JSON.stringify(S.info)) return;
      S.info = info; applyTheme(info.activity.theme);
      if (!$('step-home').classList.contains('hidden')) renderHome();
    } catch {}
  }, 10000);

  function renderPicks(pq) {
    const opts = targets(S.tab);
    $('picks').innerHTML = pq.map((c) => {
      const d = S.done.pick.has(c.id);
      return `<div class="pickcard ${d ? 'done' : ''}" data-c="${c.id}">
        <div class="top"><b>${esc(c.label)}</b><span class="ptag ${d ? 'ok' : ''}">${d ? '已投 ✓' : '選一個'}</span></div>
        ${c.description ? `<div class="sub">${esc(c.description)}</div>` : ''}
        ${d ? '' : `<div class="picks">${opts.map((o) => `<button data-t="${o.id}" ${S.tab === 'inter' ? `style="background:${groupColor(o.position)};color:#fff"` : ''}>${esc(o.name)}</button>`).join('')}</div>`}
      </div>`;
    }).join('');
    $('picks').querySelectorAll('.pickcard:not(.done) .picks button').forEach((b) => b.onclick = async () => {
      const cid = b.closest('.pickcard').dataset.c, c = S.info.criteria.find((x) => x.id === cid);
      if (!S.info.activity.is_open) { toast('老師還沒開放評分'); return; }
      if (!confirm(`「${c.label}」\n確定選「${b.textContent}」？送出後無法修改。`)) return;
      try {
        await rpc('student_pick', { p_code: S.code, p_member: S.me.id, p_token: deviceToken(), p_criterion: cid, p_target: b.dataset.t });
        S.done.pick.add(cid); toast('已送出 ✓'); renderHome();
      } catch (e) { $('progress').textContent = errMsg(e); if (/回答過/.test(e.message)) { S.done.pick.add(cid); renderHome(); } }
    });
  }

  // ── 4. 評分表單 ──
  function openForm(kind, id) {
    if (!S.info.activity.is_open) { toast('老師還沒開放評分'); return; }
    const t = targets(kind).find((x) => x.id === id);
    S.target = { kind, id };
    try { sessionStorage.setItem('peer-open', JSON.stringify(S.target)); } catch {}
    const key = `draft:${S.code}:${S.me.id}:${id}`;
    S.answers = store.get(key) || {};
    const max = S.info.activity.scale_max;
    $('form-kind').textContent = kind === 'inter' ? '評其他組' : '評組員';
    $('form-target').innerHTML = kind === 'inter' ? groupChip(t.name, t.position) : esc(t.name);
    $('err-form').textContent = '';
    $('form-crit').innerHTML = crits(kind).map((c) => `
      <div class="crit" data-id="${c.id}">
        <div class="q">${esc(c.label)}${qt(c) === 'text' ? ` <span class="sub">（${c.required ? '必填' : '選填'}）</span>` : ''}</div>
        ${c.description ? `<div class="d">${esc(c.description)}</div>` : ''}
        ${qt(c) === 'text'
          ? `<textarea data-text="${c.id}" placeholder="寫下具體的觀察或建議">${esc(S.answers[c.id] || '')}</textarea>`
          : `<div class="scale" role="radiogroup" aria-label="${esc(c.label)}">${
              Array.from({ length: max }, (_, i) => i + 1).map((v) =>
                `<button type="button" role="radio" aria-label="${v} 分${word(v) ? '，' + word(v) : ''}" data-v="${v}">${v}</button>`).join('')}</div>
             <div class="scale-read"><span>1 = ${max === 5 ? '待加強' : '最低'}</span><b></b><span>${max} = ${max === 5 ? '優秀' : '最高'}</span></div>`}
      </div>`).join('');
    $('form-crit').querySelectorAll('.crit').forEach((el) => {
      const cid = el.dataset.id;
      const paint = () => {
        const v = S.answers[cid] || 0;
        el.querySelectorAll('.scale button').forEach((x) => {
          const n = +x.dataset.v;
          x.classList.toggle('fill', n <= v); x.classList.toggle('cur', n === v); x.setAttribute('aria-checked', n === v);
        });
        const r = el.querySelector('.scale-read b'); if (r) r.textContent = v ? `${v} 分${word(v) ? '・' + word(v) : ''}` : '';
      };
      el.querySelectorAll('.scale button').forEach((b) => b.onclick = () => {
        S.answers[cid] = +b.dataset.v;
        $('err-form').textContent = '';
        paint(); store.set(key, S.answers);
      });
      paint();
      const ta = el.querySelector('textarea');
      if (ta) ta.oninput = () => { S.answers[cid] = ta.value; store.set(key, S.answers); };
    });
    show('form');
  }
  $('back-home').onclick = renderHome;
  $('btn-submit').onclick = async () => {
    const { kind, id } = S.target;
    const scores = {}, texts = {};
    const missing = [];
    for (const c of crits(kind)) {
      if (qt(c) === 'text') { const v = (S.answers[c.id] || '').trim(); if (v) texts[c.id] = v; else if (c.required) missing.push(c.label); }
      else if (S.answers[c.id]) scores[c.id] = S.answers[c.id];
      else missing.push(c.label);
    }
    if (missing.length) { $('err-form').textContent = '還沒完成：' + missing.join('、'); return; }
    const name = targets(kind).find((x) => x.id === id).name;
    if (!confirm(`確定送出對「${name}」的評分？送出後無法修改。`)) return;
    $('btn-submit').disabled = true;
    try {
      await rpc(kind === 'inter' ? 'student_rate_group' : 'student_rate_member', {
        p_code: S.code, p_member: S.me.id, p_token: deviceToken(), p_target: id,
        p_scores: scores, p_comment: Object.keys(texts).length ? JSON.stringify(texts) : '',
      });
      S.done[kind].add(id);
      store.del(`draft:${S.code}:${S.me.id}:${id}`);
      toast('已送出 ✓');
      renderHome();
    } catch (e) {
      $('err-form').textContent = errMsg(e);
      if (/已經評過/.test(e.message)) { S.done[kind].add(id); }
    } finally { $('btn-submit').disabled = false; }
  };

  // ── 啟動：網址帶 ?code= 或上次輸入過的代碼 ──
  const urlCode = new URLSearchParams(location.search).get('code');
  const start = store.get('mine') || urlCode || store.get('code');
  // 重新進來（含手機下拉重新整理）時先套上次的背景、顯示載入中，不閃出輸入代碼頁
  if (start) { applyTheme(store.get('theme')); show('load'); $('code').value = start; enterCode(start); }
  else show('code');
})();
</script>
</body>
</html>
