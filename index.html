<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAPP 工具箱</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --paper: #fffdf8;
  --dot: #e4dfd3;
  --ink: #2f2b33;
  --ink-dim: #6b6470;
  --purple: #7a5ae0;
  --blue: #2f7fd6;
}
body {
  font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  background: var(--paper);
  background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px);
  background-size: 22px 22px;
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 56px 20px 32px;
}
header { text-align: center; margin-bottom: 44px; }
.logo { font-size: 34px; font-weight: 900; color: var(--purple); position: relative; }
.logo::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 6px; border-radius: 6px;
  background: linear-gradient(90deg, #b9a4ff, #ffd36b, #8fc8ff);
}
.logo-sub { font-size: 34px; font-weight: 800; margin-left: 6px; }
.tagline { margin-top: 14px; color: #7a7380; font-size: 15px; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 280px));
  gap: 36px 28px;
  justify-content: center;
  width: 100%;
  max-width: 960px;
}
.card {
  position: relative;
  display: flex; flex-direction: column;
  background: #fff;
  border-radius: 6px 6px 20px 6px;
  padding: 36px 24px 26px;
  text-decoration: none;
  color: var(--ink);
  box-shadow: 0 8px 22px rgba(90, 70, 60, .09);
  transition: transform .2s cubic-bezier(.3, 1.6, .5, 1), box-shadow .2s;
}
/* 手帳便利貼：平常微微歪著，滑過時輕晃擺正 */
.c1 { transform: rotate(-1.6deg); }
.c2 { transform: rotate(1.3deg); }
.c1:hover, .c1:focus-visible { transform: rotate(.8deg) translateY(-5px); }
.c2:hover, .c2:focus-visible { transform: rotate(-.8deg) translateY(-5px); }
.card:not(.coming):hover { box-shadow: 0 16px 32px rgba(90, 70, 60, .15); }

/* 頂端彩帶 */
.card:not(.coming)::after {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 9px; border-radius: 6px 6px 0 0;
}
.c1::after { background: linear-gradient(90deg, #b9a4ff, #f5b3e0); }
.c2::after { background: linear-gradient(90deg, #8fc8ff, #ffd36b); }

.icon { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; margin-bottom: 16px; }
.emoji { font-size: 36px; line-height: 1; }
.c1 .icon, .c2 .icon { width: auto; height: auto; justify-content: start; margin-bottom: 14px; }
.icon svg { width: 42px; height: 42px; }
.icon { transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
.card:not(.coming):hover .icon { transform: rotate(-8deg) scale(1.12); }
.c1 .icon { background: none; }
.c2 .icon { background: none; }
.card h2 { font-size: 20px; margin-bottom: 8px; }
.card p { text-wrap: pretty; font-size: 14px; line-height: 1.7; color: var(--ink-dim); flex: 1; }
.go { margin-top: 18px; font-size: 14px; font-weight: 700; }
.c1 .go { color: var(--purple); }
.c2 .go { color: var(--blue); }

.coming { background: rgba(255, 255, 255, .55); border: 2px dashed #e0d9cc; box-shadow: none; cursor: default; }
.coming .icon { background: none; width: auto; height: auto; justify-content: start; margin-bottom: 14px; opacity: .55; }

footer { margin-top: auto; padding-top: 48px; font-size: 12px; text-align: center; }
footer a { color: var(--purple); text-decoration: none; }

@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
}
</style>
</head>
<body>

<header>
  <div><span class="logo">JAPP</span><span class="logo-sub">工具箱</span></div>
  <p class="tagline">純瀏覽器端、免安裝、檔案不離開你的電腦</p>
</header>

<div class="grid">
  <a class="card c1" href="class-wheel/index.html">
    <div class="icon"><span class="emoji">🎡</span></div>
    <h2>課堂轉盤</h2>
    <p>隨機抽人、分組、抽組長。</p>
    <span class="go">開始使用 →</span>
  </a>

  <a class="card c2" href="peer-review/admin.html">
    <div class="icon"><span class="emoji">📝</span></div>
    <h2>同儕互評</h2>
    <p>學生掃碼評分，老師一鍵算成績。</p>
    <span class="go">開始使用 →</span>
  </a>

  <div class="card coming">
    <div class="icon"><span class="emoji">✨</span></div>
    <h2>下一個小工具</h2>
    <p>構思中，歡迎許願！</p>
  </div>
</div>

<footer>
  <a href="https://github.com/JSai99/JAPP">GitHub</a>
</footer>

</body>
</html>
