<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAPP 工具箱</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --paper: #fffdf8;
  --dot: #e4dfd3;
  --ink: #2f2b33;
  --ink-dim: #6b6470;
  --orange: #f0734f;
  --mint: #2a9d84;
}
body {
  font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  background: var(--paper);
  background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px);
  background-size: 22px 22px;
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 56px 20px 32px;
}
header { text-align: center; margin-bottom: 44px; }
.logo { font-size: 34px; font-weight: 900; color: var(--orange); position: relative; }
.logo::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 6px; border-radius: 6px;
  background: linear-gradient(90deg, #ffb08f, #ffd36b, #7fd8c0);
}
.logo-sub { font-size: 34px; font-weight: 800; margin-left: 6px; }
.tagline { margin-top: 14px; color: #7a7380; font-size: 15px; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 280px));
  gap: 40px 28px;
  justify-content: center;
  width: 100%;
  max-width: 960px;
}
.card {
  position: relative;
  display: flex; flex-direction: column;
  background: #fff;
  border-radius: 6px 6px 20px 6px;
  padding: 36px 24px 26px;
  text-decoration: none;
  color: var(--ink);
  box-shadow: 0 8px 22px rgba(90, 70, 60, .09);
  transition: transform .2s cubic-bezier(.3, 1.6, .5, 1), box-shadow .2s;
}
/* 手帳便利貼：平常微微歪著，滑過時輕晃擺正 */
.c1 { transform: rotate(-1.6deg); }
.c2 { transform: rotate(1.3deg); }
.c1:hover, .c1:focus-visible { transform: rotate(.8deg) translateY(-5px); }
.c2:hover, .c2:focus-visible { transform: rotate(-.8deg) translateY(-5px); }
.card:not(.coming):hover { box-shadow: 0 16px 32px rgba(90, 70, 60, .15); }

/* 頂端彩帶 */
.card:not(.coming)::after {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 9px; border-radius: 6px 6px 0 0;
}
.c1::after { background: linear-gradient(90deg, #ffb08f, #ffc98f); }
.c2::after { background: linear-gradient(90deg, #7fd8c0, #9fd0f5); }

/* 角落便利貼＝工具圖示 */
.icon {
  position: absolute; top: -20px; right: 20px; width: 76px; height: 76px; z-index: 2;
  display: grid; place-items: center;
  border-radius: 4px 4px 4px 18px;
  box-shadow: 0 6px 12px rgba(0, 0, 0, .08);
  transition: transform .25s cubic-bezier(.3, 1.6, .5, 1);
}
.icon svg { width: 44px; height: 44px; }
.c1 .icon { background: #ffe48a; color: #c2562f; transform: rotate(8deg); }
.c2 .icon { background: #ffc9d6; color: #1f7f6b; transform: rotate(-7deg); }
.c1:hover .icon { transform: rotate(-4deg) scale(1.06); }
.c2:hover .icon { transform: rotate(5deg) scale(1.06); }
.card h2 { margin-top: 6px; padding-right: 84px; }
.card h2 { font-size: 20px; margin-bottom: 8px; }
.card p { text-wrap: pretty; font-size: 14px; line-height: 1.7; color: var(--ink-dim); flex: 1; }
.go { margin-top: 18px; font-size: 14px; font-weight: 700; }
.c1 .go { color: var(--orange); }
.c2 .go { color: var(--mint); }

.coming { background: rgba(255, 255, 255, .55); border: 2px dashed #e0d9cc; box-shadow: none; cursor: default; }
.coming .icon { background: #fbf8f2; border: 2px dashed #e0d9cc; box-shadow: none; color: #b5ab9b; transform: rotate(4deg); }

footer { margin-top: auto; padding-top: 48px; font-size: 12px; text-align: center; }
footer a { color: var(--orange); text-decoration: none; }

@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
}
</style>
</head>
<body>

<header>
  <div><span class="logo">JAPP</span><span class="logo-sub">工具箱</span></div>
  <p class="tagline">純瀏覽器端、免安裝、檔案不離開你的電腦</p>
</header>

<div class="grid">
  <a class="card c1" href="class-wheel/index.html">
    <div class="icon"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="26" r="16"/><circle cx="24" cy="26" r="3.2"/><path d="M24 10v12.8M24 29.2V42M8 26h12.8M27.2 26H40M12.7 14.7l9 9M26.3 28.3l9 9M35.3 14.7l-9 9M21.7 28.3l-9 9"/><path d="M20 4.5h8L24 10z" fill="currentColor"/></svg></div>
    <h2>課堂轉盤</h2>
    <p>隨機抽人、分組、抽組長。</p>
    <span class="go">開始使用 →</span>
  </a>

  <a class="card c2" href="peer-review/admin.html">
    <div class="icon"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="8" width="30" height="35" rx="5"/><path d="M18 8V5.5h12V8"/><path d="M16 20l2.5 2.5L23 18M16 31l2.5 2.5L23 29"/><path d="M28 20.5h5M28 31.5h5"/></svg></div>
    <h2>同儕互評</h2>
    <p>學生掃碼評分，老師一鍵算成績。</p>
    <span class="go">開始使用 →</span>
  </a>

  <div class="card coming">
    <div class="icon"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M24 13v22M13 24h22"/></svg></div>
    <h2>下一個小工具</h2>
    <p>構思中，歡迎許願！</p>
  </div>
</div>

<footer>
  <a href="https://github.com/JSai99/JAPP">GitHub</a>
</footer>

</body>
</html>
