<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAPP 工具箱</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #26292b;
  --card: #323639;
  --accent: #4f8cff;
  --text: #e8eaed;
  --text-dim: #9aa0a6;
}
body {
  font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 48px 24px;
}
header { text-align: center; margin-bottom: 40px; }
.logo {
  display: inline-block;
  font-size: 15px; font-weight: 800; letter-spacing: 1px;
  background: var(--accent); color: #fff;
  padding: 4px 12px; border-radius: 8px 0 0 8px;
}
.logo-sub {
  display: inline-block;
  font-size: 15px; background: #1c1e1f; color: var(--text-dim);
  padding: 4px 12px; border-radius: 0 8px 8px 0;
}
h1 { font-size: 26px; margin: 18px 0 8px; }
.tagline { color: var(--text-dim); font-size: 14px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 300px));
  gap: 20px;
  justify-content: center;
  width: 100%;
  max-width: 980px;
}
.card {
  background: var(--card);
  border: 1px solid #44484c;
  border-radius: 14px;
  padding: 26px 22px;
  text-decoration: none;
  color: var(--text);
  transition: transform .12s, border-color .12s, box-shadow .12s;
  display: block;
}
.card:hover {
  transform: translateY(-3px);
  border-color: var(--accent);
  box-shadow: 0 6px 20px rgba(0,0,0,.35);
}
.card .icon { font-size: 34px; margin-bottom: 12px; }
.card h2 { font-size: 17px; margin-bottom: 6px; }
.card p { font-size: 13px; color: var(--text-dim); line-height: 1.6; }
.card.coming {
  border-style: dashed;
  opacity: .55;
  cursor: default;
}
footer { margin-top: auto; padding-top: 40px; font-size: 12px; color: var(--text-dim); text-align: center; }
footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>

<header>
  <div><span class="logo">JAPP</span><span class="logo-sub">工具箱</span></div>
  <h1>自己動手做的小工具們</h1>
  <p class="tagline">純瀏覽器端、免安裝、檔案不離開你的電腦</p>
</header>

<div class="grid">
  <a class="card" href="pdf-studio/index.html">
    <div class="icon">📄</div>
    <h2>PDF 工作室</h2>
    <p>閱讀、文字/螢光筆/修正帶註記、取代原文、關鍵字搜尋、頁面增刪旋轉排序、多檔合併、另存新檔。</p>
  </a>

  <div class="card coming">
    <div class="icon">🧰</div>
    <h2>下一個小工具</h2>
    <p>正在構思中——有想法歡迎提出！</p>
  </div>
</div>

<footer>
  以開源函式庫打造（pdf.js・pdf-lib）｜<a href="https://github.com/JSai99/JAPP">GitHub</a>
</footer>

</body>
</html>
